# Postgres and Metabase for the marts.
#   docker compose up -d db metabase
#   python -m bookings backfill 2026-06-01 2026-10-17 && python -m bookings ga4
#   docker compose --profile load run --rm loader
#   open http://localhost:3000 and add the Postgres database (host db, user/password/database: warehouse)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse
      POSTGRES_DB: warehouse
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse"]
      interval: 5s
      retries: 10

  metabase:
    image: metabase/metabase:v0.50.0
    ports: ["3000:3000"]
    depends_on: [db]
    volumes: ["metabase-data:/metabase-data"]
    environment:
      MB_DB_FILE: /metabase-data/metabase.db

  loader:
    build: .
    profiles: ["load"]
    depends_on:
      db: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql://warehouse:warehouse@db:5432/warehouse
      MARTS_DIR: /data/marts
    volumes: ["./data:/data"]
    entrypoint: ["python", "scripts/export_to_postgres.py"]

volumes:
  pgdata:
  metabase-data:
